<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baixando Vídeo...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .status {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .progress-container {
      background: #f0f0f0;
      border-radius: 8px;
      height: 40px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      color: #333;
      font-weight: 500;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-cancel {
      background: #f44336;
      color: white;
    }

    .btn-cancel:hover {
      background: #d32f2f;
    }

    .btn-close {
      background: #4CAF50;
      color: white;
      display: none;
    }

    .btn-close:hover {
      background: #45a049;
    }

    video {
      display: none;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📥 Baixando Vídeo</h1>
    <p class="status" id="status">Preparando download...</p>

    <div class="progress-container">
      <div class="progress-bar" id="progress">0%</div>
    </div>

    <div class="info">
      <div class="info-item">
        <span class="info-label">Arquivo:</span>
        <span class="info-value" id="filename">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Tamanho:</span>
        <span class="info-value" id="size">Calculando...</span>
      </div>
      <div class="info-item">
        <span class="info-label">Velocidade:</span>
        <span class="info-value" id="speed">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Tempo restante:</span>
        <span class="info-value" id="time">-</span>
      </div>
    </div>

    <button class="btn btn-cancel" id="cancelBtn">Cancelar</button>
    <button class="btn btn-close" id="closeBtn">Fechar</button>

    <div class="error" id="error"></div>
  </div>

  <script src="ffmpeg-core.js"></script>
  <script src="hls-downloader.js"></script>
</body>
</html>
